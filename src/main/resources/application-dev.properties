# Define a porta que a aplicação irá rodar
server.port=8081

# Se conecta ao banco de dados
spring.datasource.url=jdbc:mysql://localhost:3356/order_payment_management
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:mysqlPW}

# Atualiza as tabelas SQL automaticamente após alterações nas entidades
spring.jpa.hibernate.ddl-auto=update
# Formata corretamente os comandos SQL mostrados no console
spring.pa.properties.hibernate.format_sql=true

# Mostra os comandos SQL gerados pelo hibernate no console após fazer alguma operação e salva em um log adicionando data, hora, ID da requisiçaõ e a classe que gerou o comando
logging.level.org.hibernate.SQL=DEBUG
# Exibe os valores reais dos comandos SQL mostrados no console ao invés de (?)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE